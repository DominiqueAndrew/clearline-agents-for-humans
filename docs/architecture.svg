<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Clearline architecture</title>
  <desc id="desc">An invoice stream enters a background worker and Strands agent, then a deterministic safety gate either files locally or asks for a human decision before writing to an audit log.</desc>
  <rect width="1400" height="470" rx="24" fill="#f3f6f2"/>
  <text x="52" y="58" fill="#183a49" font-family="Arial, sans-serif" font-size="25" font-weight="700">Clearline · control plane</text>
  <text x="52" y="84" fill="#718087" font-family="Arial, sans-serif" font-size="14">Background work stays quiet. Ambiguity stays with a person.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(52 145)"><rect width="180" height="104" rx="14" fill="#fff" stroke="#dfe7e1"/><circle cx="28" cy="28" r="14" fill="#e9f0ef"/><text x="55" y="32" fill="#183a49" font-size="15" font-weight="700">Invoice stream</text><text x="20" y="64" fill="#718087" font-size="12">synthetic demo</text><text x="20" y="82" fill="#718087" font-size="12">fixtures</text></g>
    <g transform="translate(272 145)"><rect width="190" height="104" rx="14" fill="#fff" stroke="#dfe7e1"/><circle cx="28" cy="28" r="14" fill="#e9f0ef"/><text x="55" y="32" fill="#183a49" font-size="15" font-weight="700">Background worker</text><text x="20" y="64" fill="#718087" font-size="12">run once or scheduled</text><text x="20" y="82" fill="#718087" font-size="12">no screen required</text></g>
    <g transform="translate(502 145)"><rect width="210" height="104" rx="14" fill="#183a49"/><circle cx="28" cy="28" r="14" fill="#e7b56e"/><text x="55" y="32" fill="#fff" font-size="15" font-weight="700">Strands agent</text><text x="20" y="64" fill="#cfdbdc" font-size="12">extract + explain</text><text x="20" y="82" fill="#cfdbdc" font-size="12">tool seam</text></g>
    <g transform="translate(752 145)"><rect width="214" height="104" rx="14" fill="#fff" stroke="#dfe7e1"/><circle cx="28" cy="28" r="14" fill="#fff4e1"/><text x="55" y="32" fill="#183a49" font-size="15" font-weight="700">Safety gate</text><text x="20" y="64" fill="#718087" font-size="12">policy · duplicate</text><text x="20" y="82" fill="#718087" font-size="12">deterministic outcome</text></g>
    <g transform="translate(1022 92)"><rect width="170" height="90" rx="14" fill="#e9f5ef" stroke="#cfe8dc"/><text x="20" y="31" fill="#278267" font-size="14" font-weight="700">Safe</text><text x="20" y="56" fill="#507a6c" font-size="12">local ledger</text><text x="20" y="73" fill="#507a6c" font-size="12">auto-file</text></g>
    <g transform="translate(1022 210)"><rect width="170" height="90" rx="14" fill="#fff4e1" stroke="#f0dfc1"/><text x="20" y="31" fill="#c27b24" font-size="14" font-weight="700">Ambiguous</text><text x="20" y="56" fill="#96724a" font-size="12">human queue</text><text x="20" y="73" fill="#96724a" font-size="12">approve or hold</text></g>
